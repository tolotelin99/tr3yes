<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>tr3yes — Login SOC Corporativo</title>
    <style>
        body { background: #000000; color: #00ff66; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #050b14; border: 1px solid #00ff66; padding: 30px; border-radius: 4px; width: 400px; }
        h2 { color: #00ff66; margin-bottom: 10px; font-size: 18px; text-align: center; }
        .sub { color: #00ffff; font-size: 12px; text-align: center; margin-bottom: 20px; }
        label { display: block; font-size: 12px; margin-bottom: 6px; color: #00ff66; }
        input { width: 100%; background: #000; border: 1px solid #00ff66; color: #00ff66; padding: 10px; border-radius: 2px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        button { width: 100%; background: #00ff66; color: #000; border: none; padding: 10px; border-radius: 2px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #00ffff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>[tr3yes-soc ~]# auth</h2>
        <div class="sub">-- TRIPLE SENSOR ACTIVO --</div>
        <form method="POST" action="/login">
            <label for="token-input">Token de Acceso:</label>
            <input type="password" id="token-input" name="token" placeholder="tr3yes_sec_2026" required>
            <button type="submit">EXECUTE LOGIN</button>
        </form>
    </div>
</body>
</html>
